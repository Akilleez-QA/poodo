<title id="banner-title">POODO Bantha ASCII banner</title>
<desc id="banner-description">The original ASCII Bantha and small poodo pile, with warm brown fur, ivory horns, and a gold POODO wordmark on a dark background. Every character and its position is preserved.</desc>
